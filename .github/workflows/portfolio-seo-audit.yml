name: Portfolio SEO baseline audit
on:
  workflow_dispatch:
  schedule:
    - cron: '25 5 * * 1'
permissions:
  contents: read
jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit verified public portfolio domains
        run: node scripts/audit-portfolio-seo.mjs
      - name: Upload read-only report
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-seo-report
          path: seo-audit/portfolio-seo-report.json
          retention-days: 60
